<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Clipboard v10</title>
<style>
:root {
  --bg: #0d0d0d; --surface: #141414; --surface2: #1a1a1a;
  --border: #2a2a2a; --text: #e8e6e0; --text2: #6b6b6b;
  --accent: #f59e0b; --accent-dim: rgba(245,158,11,0.15);
  --success: #22c55e; --danger: #ef4444;
  --font: "SF Mono","Fira Code","Cascadia Code","Consolas",monospace;
}
[data-theme="light"] {
  --bg: #f7f5f0; --surface: #ffffff; --surface2: #f0ede8;
  --border: #e0ddd5; --text: #1a1a1a; --text2: #8a8a8a;
  --accent: #d97706; --accent-dim: rgba(217,119,6,0.10);
  --success: #16a34a; --danger: #dc2626;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; overflow-y: auto;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 13px;
  background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
}
#app-header {
  position: sticky; top: 0; z-index: 100; height: 52px;
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.header-logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
  color: var(--accent); white-space: nowrap;
}
.header-search-wrap {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 0 10px; max-width: 360px;
}
.header-search-wrap input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--font); font-size: 12px; padding: 6px 0;
}
.header-search-wrap input::placeholder { color: var(--text2); }
#search-clear {
  background: transparent; border: none; color: var(--text2);
  cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1;
}
.header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
#card-grid {
  column-count: 4; column-gap: 12px; padding: 12px;
}
.card {
  break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
  display: block; margin-bottom: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; overflow: visible;
}
.card-header {
  padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text2); font-weight: 600;
}
.card-title::before { content: "// "; color: var(--accent); }
.card-body { padding: 12px 14px; }
@media (max-width: 1400px) { #card-grid { column-count: 3; } }
@media (max-width: 1024px) { #card-grid { column-count: 2; } }
@media (max-width: 768px) { #card-grid { column-count: 1; } }
.field-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.field-row:last-child { border-bottom: none; }
.field-label {
  display: flex; align-items: center; gap: 4px;
  flex-shrink: 0; width: 100px; font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text2); padding-top: 4px;
}
.field-label .icon { flex-shrink: 0; }
.field-value {
  flex: 1; display: flex; align-items: center;
  gap: 4px; flex-wrap: wrap; min-width: 0;
}
.field-input {
  flex: 1; min-width: 60px; background: transparent;
  border: none; border-bottom: 1px solid transparent;
  color: var(--text); font-family: var(--font);
  font-size: 12px; padding: 3px 0; outline: none;
  transition: border-color 0.15s;
}
body.edit-mode .field-input { border-bottom-color: var(--border); cursor: text; }
body.edit-mode .field-input:focus { border-bottom-color: var(--accent); }
body:not(.edit-mode) .field-input { pointer-events: none; }
[data-theme="light"] body.edit-mode .field-input {
  border: 1px solid var(--border); border-radius: 3px;
  padding: 3px 6px; background: var(--surface);
}
textarea.field-input {
  min-height: 100px; resize: vertical;
  border: 1px solid transparent; border-radius: 4px;
  padding: 6px; width: 100%;
}
body.edit-mode textarea.field-input { border-color: var(--border); }
.btn-copy {
  display: inline-flex; align-items: center; justify-content: center; gap: 3px;
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  border-radius: 4px; padding: 3px 7px; font-family: var(--font); font-size: 9px;
  cursor: pointer; transition: all 0.15s; min-height: 26px; white-space: nowrap; flex-shrink: 0;
}
.btn-copy:hover { border-color: var(--accent); color: var(--accent); }
.btn-copy.copied { border-color: var(--success); color: var(--success); transform: scale(0.95); }
.btn-sm { padding: 2px 5px; font-size: 8px; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent); color: #000; border: none; border-radius: 16px;
  padding: 5px 12px; font-family: var(--font); font-size: 11px; font-weight: 700;
  cursor: pointer; min-height: 32px;
}
.btn-secondary {
  display: inline-flex; align-items: center; gap: 5px;
  background: transparent; border: 1px solid var(--border); color: var(--text2);
  border-radius: 16px; padding: 5px 12px; font-family: var(--font); font-size: 11px;
  cursor: pointer; min-height: 32px;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; background: transparent; border: 1px solid var(--border);
  border-radius: 6px; color: var(--text2); cursor: pointer;
}
.btn-icon:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-danger:hover { background: rgba(239,68,68,0.1); }
.icon { width: 16px; height: 16px; stroke: currentColor; fill: none; flex-shrink: 0; }
.icon-sm { width: 14px; height: 14px; }
.icon-xs { width: 11px; height: 11px; }
.entry-card {
  border: 1px solid var(--border); border-radius: 6px;
  padding: 10px; margin-bottom: 10px; background: var(--surface2);
}
.entry-card-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.entry-label { font-size: 9px; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; }
.btn-add-entry { display: none; margin-top: 8px; }
body.edit-mode .btn-add-entry { display: inline-flex; }
.btn-add-custom { display: none; margin-top: 8px; }
body.edit-mode .btn-add-custom { display: inline-flex; }
.btn-delete-entry, .btn-delete-custom { display: none; }
body.edit-mode .btn-delete-entry, body.edit-mode .btn-delete-custom { display: inline-flex; }
.drop-zone {
  border: 2px dashed var(--border); border-radius: 8px; padding: 20px;
  text-align: center; color: var(--text2); transition: all 0.2s;
  margin-bottom: 10px; font-size: 11px; cursor: pointer;
}
.drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.file-item {
  display: flex; align-items: center; gap: 8px; padding: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 5px; margin-bottom: 6px;
}
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-meta { font-size: 9px; color: var(--text2); }
.storage-bar-wrap { margin-top: 10px; }
.storage-bar-label { display: flex; justify-content: space-between; font-size: 9px; color: var(--text2); margin-bottom: 4px; }
.storage-bar { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.storage-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.storage-bar-fill.warn { background: var(--danger); }
.custom-field-row {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 0; border-bottom: 1px dashed var(--border);
}
.custom-label-input {
  background: transparent; border: none; border-bottom: 1px solid var(--border);
  color: var(--text2); font-family: var(--font); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.08em; width: 90px; outline: none;
}
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--success); padding: 8px 14px; border-radius: 6px;
  font-size: 11px; z-index: 9999; opacity: 0; transform: translateY(10px);
  transition: all 0.2s; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateY(0); }
#editing-badge {
  background: var(--accent); color: #000; font-size: 10px;
  padding: 3px 10px; border-radius: 10px; font-weight: 700; letter-spacing: 0.05em;
}
</style>
</head>

  <div class="header-logo">
    <svg class="icon" style="stroke:var(--accent)"><use href="#icon-contact"/></svg>
    <span>CLIPBOARD</span>
  </div>
  <div class="header-search-wrap">
    <svg class="icon icon-sm" style="stroke:var(--text2)"><use href="#icon-search"/></svg>

<script>
const STORAGE_KEY = 'jobclipboard_v10';

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

const defaultData = {
  contact: { resumeLink:'', name:'', phone:'', email:'', location:'', linkedin:'', github:'', portfolio:'', custom:[] },
  education: [{ degree:'', institution:'', location:'', dateRange:'', custom:[] }],
  work: [{ company:'', title:'', dateRange:'', location:'', workMode:'', description:'', custom:[] }],
  skills: { value:'', custom:[] },
  projects: [{ name:'', description:'', techStack:'', custom:[] }],
  qa: { currentCtc:'', expectedCtc:'', noticePeriod:'', joiningDate:'', totalExp:'', relevantExp:'', relocation:'', remoteMode:'', workAuth:'', reasonForChange:'', custom:[] },
  pitch: { aboutYourself:'', coverLetter:'', custom:[] },
  notes: { value:'', custom:[] },
  files: []
};

const entryDefaults = {
  education: { degree:'', institution:'', location:'', dateRange:'', custom:[] },
  work: { company:'', title:'', dateRange:'', location:'', workMode:'', description:'', custom:[] },
  projects: { name:'', description:'', techStack:'', custom:[] }
};

let appData = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || deepClone(defaultData);
let editMode = false;
let saveTimer = null;
let toastTimer = null;

// ── HELPERS ──────────────────────────────────────────────────────────────────

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fieldRow(icon, label, type, val, section, key, entryIdx) {
  const setter = entryIdx !== undefined
    ? `setEntryVal('${section}',${entryIdx},'${key}',this.value)`
    : `setVal('${section}','${key}',this.value)`;
  const getter = entryIdx !== undefined
    ? `appData.${section}[${entryIdx}].${key}`
    : `appData.${section}.${key}`;
  return `<div class="field-row">
    <label class="field-label"><svg class="icon icon-xs"><use href="#icon-${icon}"/></svg>${label}</label>
    <div class="field-value">
      <input class="field-input" type="${type}" value="${esc(val)}" placeholder="${label}" oninput="${setter}">
      <button class="btn-copy" onclick="copyVal(${getter},this)">
        <svg class="icon icon-xs"><use href="#icon-copy"/></svg>
      </button>
    </div>
  </div>`;
}

function nameRow(val) {
  return `<div class="field-row">
    <label class="field-label"><svg class="icon icon-xs"><use href="#icon-name"/></svg>Full Name</label>
    <div class="field-value">
      <input class="field-input" type="text" value="${esc(val)}" placeholder="First Last" oninput="setVal('contact','name',this.value)">
      <button class="btn-copy btn-sm" onclick="copyNamePart('first',this)">1st</button>
      <button class="btn-copy btn-sm" onclick="copyNamePart('last',this)">Last</button>
      <button class="btn-copy" onclick="copyVal(appData.contact.name,this)">
        <svg class="icon icon-xs"><use href="#icon-copy"/></svg>
      </button>
    </div>
  </div>`;
}

function dateRangeRow(val, section, idx) {
  return `<div class="field-row">
    <label class="field-label"><svg class="icon icon-xs"><use href="#icon-date"/></svg>Date Range</label>
    <div class="field-value">
      <input class="field-input" type="text" value="${esc(val)}" placeholder="2020 – 2024" oninput="setEntryVal('${section}',${idx},'dateRange',this.value)">
      <button class="btn-copy btn-sm" onclick="copyDatePart('start','${section}',${idx},this)">Start</button>
      <button class="btn-copy btn-sm" onclick="copyDatePart('end','${section}',${idx},this)">End</button>
    </div>
  </div>`;
}

function textareaRow(icon, label, val, section, key, entryIdx) {
  const setter = entryIdx !== undefined
    ? `setEntryVal('${section}',${entryIdx},'${key}',this.value)`
    : `setVal('${section}','${key}',this.value)`;
  const getter = entryIdx !== undefined
    ? `appData.${section}[${entryIdx}].${key}`
    : `appData.${section}.${key}`;
  return `<div class="field-row" style="flex-direction:column;align-items:stretch;gap:6px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <label class="field-label" style="width:auto"><svg class="icon icon-xs"><use href="#icon-${icon}"/></svg>${label}</label>
      <button class="btn-copy" onclick="copyVal(${getter},this)">
        <svg class="icon icon-xs"><use href="#icon-copy"/></svg>
      </button>
    </div>
    <textarea class="field-input" placeholder="${label}" oninput="${setter}">${esc(val)}</textarea>
  </div>`;
}

function customFieldsHtml(section, entryIdx, customs) {
  return (customs || []).map((cf, ci) => {
    const valGetter = entryIdx !== null && entryIdx !== undefined
      ? `appData.${section}[${entryIdx}].custom[${ci}].value`
      : `appData.${section}.custom[${ci}].value`;
    const eidStr = (entryIdx !== null && entryIdx !== undefined) ? entryIdx : 'null';
    return `<div class="custom-field-row">
      <svg class="icon icon-xs" style="stroke:var(--accent)"><use href="#icon-custom"/></svg>
      <input class="custom-label-input" value="${esc(cf.label)}" placeholder="Label" oninput="setCustomVal('${section}',${ci},'label',this.value,${eidStr})">
      <input class="field-input" style="flex:1;pointer-events:auto" value="${esc(cf.value)}" placeholder="Value" oninput="setCustomVal('${section}',${ci},'value',this.value,${eidStr})">
      <button class="btn-copy" onclick="copyVal(${valGetter},this)">
        <svg class="icon icon-xs"><use href="#icon-copy"/></svg>
      </button>
      <button class="btn-copy btn-danger btn-delete-custom" onclick="deleteCustomField('${section}',${ci},${eidStr})">
        <svg class="icon icon-xs"><use href="#icon-delete"/></svg>
      </button>
    </div>`;
  }).join('');
}

function bindFieldInputs(container) {
  container.querySelectorAll('.field-input').forEach(el => { el.disabled = !editMode; });
  container.querySelectorAll('.custom-label-input').forEach(el => { el.disabled = !editMode; });
}

// ── DATA SETTERS ─────────────────────────────────────────────────────────────

function setVal(section, key, val) { appData[section][key] = val; save(); }
function setEntryVal(section, idx, key, val) { appData[section][idx][key] = val; save(); }
function setCustomVal(section, cidx, key, val, entryIdx) {
  if (entryIdx !== null && entryIdx !== undefined) appData[section][entryIdx].custom[cidx][key] = val;
  else appData[section].custom[cidx][key] = val;
  save();
}

// ── SAVE ─────────────────────────────────────────────────────────────────────

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    showToast('Saved ✓');
    updateStorageMeter();
  }, 300);
}

// ── COPY ─────────────────────────────────────────────────────────────────────

function copyVal(text, btn) {
  text = (text == null ? '' : String(text));
  const p = navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject();
  p.catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  flashCopy(btn);
}

function flashCopy(btn) {
  btn.classList.add('copied');
  const use = btn.querySelector('use');
  const orig = use ? use.getAttribute('href') : null;
  if (use) use.setAttribute('href','#icon-check');
  setTimeout(() => {
    btn.classList.remove('copied');
    if (use && orig) use.setAttribute('href', orig);
  }, 1500);
}

function copyNamePart(part, btn) {
  const n = (appData.contact.name || '').trim().split(/\s+/);
  copyVal(part === 'first' ? (n[0] || '') : (n[n.length - 1] || ''), btn);
}

function copyDatePart(part, section, idx, btn) {
  const raw = (Array.isArray(appData[section]) ? appData[section][idx] : appData[section]).dateRange || '';
  const sep = raw.includes('–') ? '–' : raw.includes('-') ? '-' : '/';
  const parts = raw.split(sep).map(s => s.trim());
  copyVal(part === 'start' ? (parts[0] || raw) : (parts[1] || raw), btn);
}

function copyAll(section) {
  let lines = [];
  const d = appData[section];
  if (section === 'contact') {
    if (d.name) lines.push('Name: ' + d.name);
    if (d.phone) lines.push('Phone: ' + d.phone);
    if (d.email) lines.push('Email: ' + d.email);
    if (d.location) lines.push('Location: ' + d.location);
    if (d.linkedin) lines.push('LinkedIn: ' + d.linkedin);
    if (d.github) lines.push('GitHub: ' + d.github);
    if (d.portfolio) lines.push('Portfolio: ' + d.portfolio);
    if (d.resumeLink) lines.push('Resume: ' + d.resumeLink);
    (d.custom || []).forEach(c => { if (c.value) lines.push(c.label + ': ' + c.value); });
  } else if (section === 'skills') {
    if (d.value) lines.push(d.value);
    (d.custom || []).forEach(c => { if (c.value) lines.push(c.label + ': ' + c.value); });
  } else if (section === 'qa') {
    const qMap = { currentCtc:'Current CTC', expectedCtc:'Expected CTC', noticePeriod:'Notice Period', joiningDate:'Joining Date', totalExp:'Total Exp', relevantExp:'Relevant Exp', relocation:'Relocation', remoteMode:'Remote Mode', workAuth:'Work Auth', reasonForChange:'Reason for Change' };
    Object.entries(qMap).forEach(([k, label]) => { if (d[k]) lines.push(label + ': ' + d[k]); });
    (d.custom || []).forEach(c => { if (c.value) lines.push(c.label + ': ' + c.value); });
  } else if (section === 'pitch') {
    if (d.aboutYourself) lines.push('About:\n' + d.aboutYourself);
    if (d.coverLetter) lines.push('Cover Letter:\n' + d.coverLetter);
    (d.custom || []).forEach(c => { if (c.value) lines.push(c.label + ': ' + c.value); });
  } else if (section === 'notes') {
    if (d.value) lines.push(d.value);
    (d.custom || []).forEach(c => { if (c.value) lines.push(c.label + ': ' + c.value); });
  } else if (Array.isArray(d)) {
    d.forEach((entry, i) => {
      if (d.length > 1) lines.push('--- ' + (i + 1) + ' ---');
      Object.entries(entry).forEach(([k, v]) => {
        if (k === 'custom') {
          (v || []).forEach(c => { if (c.value) lines.push(c.label + ': ' + c.value); });
        } else if (v) {
          lines.push(k + ': ' + v);
        }
      });
    });
  }
  const btn = event && event.currentTarget ? event.currentTarget : document.querySelector('#card-' + section + ' .btn-copy');
  navigator.clipboard.writeText(lines.join('\n')).catch(() => {});
  showToast('Copied!');
}

// ── EDIT MODE ─────────────────────────────────────────────────────────────────

function toggleEdit() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editing-badge').hidden = !editMode;
  const lbl = document.getElementById('edit-label');
  const use = document.getElementById('edit-toggle').querySelector('use');
  lbl.textContent = editMode ? 'Done' : 'Edit';
  use.setAttribute('href', editMode ? '#icon-save' : '#icon-edit');
  applyEditMode();
}

function applyEditMode() {
  document.querySelectorAll('.field-input').forEach(el => { el.disabled = !editMode; });
  document.querySelectorAll('.custom-label-input').forEach(el => { el.disabled = !editMode; });
  document.querySelectorAll('.btn-add-entry, .btn-add-custom').forEach(el => {
    el.style.display = editMode ? 'inline-flex' : 'none';
  });
  document.querySelectorAll('.btn-delete-entry, .btn-delete-custom').forEach(el => {
    el.style.display = editMode ? 'inline-flex' : 'none';
  });
}

// ── THEME ─────────────────────────────────────────────────────────────────────

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : '');
  localStorage.setItem('jc_theme', t);
  const use = document.getElementById('theme-toggle').querySelector('use');
  use.setAttribute('href', t === 'light' ? '#icon-moon' : '#icon-sun');
}

function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────

function exportData() {
  const b = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'job-clipboard.json'; a.click();
}

function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try { appData = JSON.parse(e.target.result); save(); renderAll(); showToast('Imported ✓'); }
    catch { showToast('Import failed'); }
  };
  r.readAsText(file);
}

// ── TOAST ─────────────────────────────────────────────────────────────────────

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── ENTRIES ───────────────────────────────────────────────────────────────────

function addEntry(section) {
  appData[section].push(deepClone(entryDefaults[section]));
  save(); renderSection(section);
}

function deleteEntry(section, idx) {
  if (!confirm('Delete this entry?')) return;
  appData[section].splice(idx, 1); save(); renderSection(section);
}

// ── CUSTOM FIELDS ─────────────────────────────────────────────────────────────

function addCustomField(section, entryIdx) {
  const field = { label: 'Custom', value: '' };
  if (entryIdx !== undefined && entryIdx !== null) appData[section][entryIdx].custom.push(field);
  else appData[section].custom.push(field);
  save(); renderSection(section);
}

function deleteCustomField(section, cidx, entryIdx) {
  if (!confirm('Delete field?')) return;
  if (entryIdx !== null && entryIdx !== undefined) appData[section][entryIdx].custom.splice(cidx, 1);
  else appData[section].custom.splice(cidx, 1);
  save(); renderSection(section);
}

// ── FILES ─────────────────────────────────────────────────────────────────────

function bindFileZone() {
  const z = document.getElementById('drop-zone');
  if (!z) return;
  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('drag-over'); });
  z.addEventListener('dragleave', () => z.classList.remove('drag-over'));
  z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('drag-over'); [...e.dataTransfer.files].forEach(readFile); });
  z.addEventListener('click', () => {
    const i = document.createElement('input'); i.type = 'file'; i.multiple = true;
    i.onchange = e => [...e.target.files].forEach(readFile); i.click();
  });
}

function readFile(file) {
  const r = new FileReader();
  r.onload = e => {
    appData.files.push({ name: file.name, size: file.size, date: new Date().toLocaleDateString(), data: e.target.result });
    save(); renderFiles();
  };
  r.readAsDataURL(file);
}

function downloadFile(idx) {
  const f = appData.files[idx];
  const a = document.createElement('a'); a.href = f.data; a.download = f.name; a.click();
}

function deleteFile(idx) {
  if (!confirm(`Delete "${appData.files[idx].name}"?`)) return;
  appData.files.splice(idx, 1); save(); renderFiles();
}

function updateStorageMeter() {
  let tot = 0;
  try {
    for (let k in localStorage) {
      if (Object.prototype.hasOwnProperty.call(localStorage, k)) tot += localStorage[k].length * 2;
    }
  } catch (e) {}
  const mb = tot / 1048576, pct = Math.min(100, mb / 5 * 100);
  const fill = document.getElementById('storage-fill');
  const lbl = document.getElementById('storage-mb');
  if (fill) { fill.style.width = pct + '%'; fill.classList.toggle('warn', pct > 80); }
  if (lbl) lbl.textContent = mb.toFixed(2) + 'MB / 5MB';
}

// ── SEARCH ────────────────────────────────────────────────────────────────────

function onSearch(q) {
  const cards = document.querySelectorAll('.card');
  if (!q.trim()) {
    cards.forEach(c => { c.style.opacity = ''; c.style.boxShadow = ''; });
    return;
  }
  cards.forEach(card => {
    const matches = card.textContent.toLowerCase().includes(q.toLowerCase());
    card.style.opacity = matches ? '1' : '0.2';
    card.style.boxShadow = matches ? '0 0 0 1px var(--accent)' : '';
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('jc_theme') ||
    (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);
  renderAll();

  document.getElementById('edit-toggle').addEventListener('click', toggleEdit);
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-input').addEventListener('change', e => importData(e.target.files[0]));
  document.getElementById('search-input').addEventListener('input', e => {
    const q = e.target.value;
    document.getElementById('search-clear').style.display = q ? 'block' : 'none';
    onSearch(q);
  });
  document.getElementById('search-clear').addEventListener('click', () => {
    document.getElementById('search-input').value = '';
    onSearch('');
    document.getElementById('search-clear').style.display = 'none';
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault(); document.getElementById('search-input').focus();
    }
    if (e.key === 'Escape') {
      document.getElementById('search-input').value = ''; onSearch('');
      document.getElementById('search-clear').style.display = 'none';
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'e') { e.preventDefault(); toggleEdit(); }
  });
});

// ── STAGGER ANIMATION ─────────────────────────────────────────────────────────

window.addEventListener('load', () => {
  document.querySelectorAll('.card').forEach((card, i) => {
    card.style.opacity = '0';
    card.style.transform = 'translateY(8px)';
    card.style.transition = `opacity 0.3s ease ${i * 40}ms, transform 0.3s ease ${i * 40}ms`;
    setTimeout(() => { card.style.opacity = '1'; card.style.transform = 'translateY(0)'; }, 50);
  });
  updateStorageMeter();
});
</script>
</body>
</html>
